      function togglePantryItem(name){setHave(function(prev){var n=Object.assign({},prev);if(n[name]){delete n[name];}else{n[name]=1;}storage.set("walkin-pantry",JSON.stringify(Object.keys(n)));return n;});}

      function removeRecipe(day,meal){setMealPlan(function(prev){var n=Object.assign({},prev);n[day]=Object.assign({},prev[day]);n[day][meal]=null;storage.set("walkin-mealplan",JSON.stringify(n));return n;});}
      function clearWeek(){var n=emptyPlan();setMealPlan(n);storage.set("walkin-mealplan",JSON.stringify(n));}
      function toggleBought(name){setBought(function(prev){var n=Object.assign({},prev);if(n[name]){delete n[name];}else{n[name]=1;}storage.set("walkin-bought",JSON.stringify(Object.keys(n)));return n;});}

      var selectedRecipe=selectedId?RECIPES.filter(function(r){return r.id===selectedId;})[0]:null;

      if(isLoading)return e("div",{className:"min-h-screen flex items-center justify-center",style:{backgroundColor:"#0b1120"}},e(Flame,{size:28,color:"#fb7a3c"}));

      return e("div",{className:"min-h-screen pb-16",style:{backgroundColor:"#0b1120"}},
        e("header",{className:"px-5 pt-8 pb-5",style:{borderBottom:"1px solid #131c2e"}},e("h1",{className:"text-slate-100 tracking-tight",style:{fontFamily:"Oswald,sans-serif",fontSize:"28px",fontWeight:700}},"THE WALK-IN"),e("p",{className:"text-sm mt-1",style:{color:"#4b5876"}},"Keto, flavor-first, built for a 15km day. No lactose, no sesame or related seeds.")),
        e("nav",{className:"sticky top-0 z-20 flex px-5 gap-1 overflow-x-auto",style:{backgroundColor:"#0b1120",borderBottom:"1px solid #131c2e"}},TABS.map(function(tb){var on=tab===tb.key;return e("button",{key:tb.key,onClick:function(){setTab(tb.key);},className:"flex items-center gap-2 px-4 py-3.5 text-sm font-medium whitespace-nowrap border-b-2",style:on?{color:"#fb7a3c",borderColor:"#fb7a3c"}:{color:"#4b5876",borderColor:"transparent"}},e(tb.icon,{size:15})," "+tb.label);})),
        e("main",{className:"px-5 pt-5 max-w-5xl mx-auto"},
          tab==="cookbook"?e(CookbookTab,{onOpen:setSelectedId}):null,
          tab==="tonight"?e(CookTonightTab,{haveIngredients:have,togglePantryItem:togglePantryItem,onOpen:setSelectedId}):null,
          tab==="planner"?e(PlannerTab,{mealPlan:mealPlan,assignRecipe:assignRecipe,removeRecipe:removeRecipe,clearWeek:clearWeek,onOpenPicker:function(day,meal){setPicker({day:day,meal:meal});}}):null,
          tab==="shopping"?e(ShoppingTab,{mealPlan:mealPlan,haveIngredients:have,boughtItems:bought,toggleBought:toggleBought,onGoToPlanner:function(){setTab("planner");}}):null
        ),
        selectedRecipe?e(RecipeDetail,{recipe:selectedRecipe,haveIngredients:have,togglePantryItem:togglePantryItem,onAssign:assignRecipe,onClose:function(){setSelectedId(null);}}):null,
        picker?e(PlannerPicker,{day:picker.day,meal:picker.meal,onPick:function(rid){assignRecipe(picker.day,picker.meal,rid);},onClose:function(){setPicker(null);}}):null
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  })();
  </script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',function(){
        navigator.serviceWorker.register('./service-worker.js').catch(function(err){console.error('SW failed:',err);});
      });
    }
  </script>
</body>
</html>
