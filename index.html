      );
    }

    var TABS=[{key:"cookbook",label:"Cookbook",ic:IBook},{key:"tonight",label:"Cook Tonight",ic:IFlame},{key:"planner",label:"Planner",ic:ICal},{key:"shopping",label:"Shopping",ic:ICart}];

    function App(){

        picker?h(PlannerPicker,{day:picker.day,meal:picker.meal,onPick:function(rid){assignRecipe(picker.day,picker.meal,rid);},onClose:function(){setPicker(null);}}):null
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  })();
