  { meal: d.breakfast.meal, type: "Breakfast", emoji: d.breakfast.emoji, day: d.day, week: w.label },
  { meal: d.lunch.meal,     type: "Lunch",     emoji: d.lunch.emoji,     day: d.day, week: w.label },

]));

function matchMealsToStock(stockItems) {
  if (!stockItems.length) return [];
  const keywords = stockItems.map(s => s.toLowerCase().replace(/[^a-z\s]/g,"").split(" ")).flat().filter(w => w.length > 3);
  return allMealPlanMeals.filter(m => {
    const ml = m.meal.toLowerCase();
    return keywords.some(kw => ml.includes(kw));
  }).slice(0, 8);
}

// ─── SHARED COMPONENTS ───────────────────────────────────────────────────────

function CheckItem({ label, detail, checked, onToggle, colorKey }) {
  const c = cMap[colorKey] || cMap.slate;
  return (
    <button onClick={onToggle} className={`w-full flex items-start gap-3 py-2 px-2 rounded-lg text-left hover:bg-white/5 transition-all ${checked ? "opacity-40" : ""}`}>
      <div className={`w-4 h-4 rounded border-2 flex-shrink-0 flex items-center justify-center mt-0.5 transition-all ${checked ? `${c.check} border-transparent` : "border-slate-600"}`}>
        {checked && <span className="text-white text-xs font-bold">✓</span>}
      </div>
      <div className="flex-1 min-w-0">
        <div className={`text-sm ${checked ? "line-through text-slate-500" : "text-white"}`}>{label}</div>
        {detail && <div className="text-xs text-slate-500 mt-0.5">{detail}</div>}
      </div>
    </button>
  );
}

// ─── SCREEN: MEAL PLAN ───────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
const mealColors = {
  breakfast: { label:"Breakfast", accent:"text-amber-400", dot:"bg-amber-400" },
  lunch:     { label:"Lunch",     accent:"text-sky-400",   dot:"bg-sky-400"   },
  dinner:    { label:"Dinner",    accent:"text-orange-400",dot:"bg-orange-400" },
};
const dayTypeStyles = {
  weekday:      { badge:"bg-slate-800 text-slate-400", border:"border-slate-700/40" },
  "weekend-light":{ badge:"bg-sky-900/40 text-sky-300", border:"border-sky-700/30" },
  "prep-day":   { badge:"bg-amber-900/40 text-amber-300", border:"border-amber-700/30" },
};

function MealPlanScreen() {
  const [week, setWeek] = useState(0);
  const [openDays, setOpenDays] = useState({ Monday: true });
  const toggleDay = (d) => setOpenDays(p => ({ ...p, [d]: !p[d] }));
  const wk = mealWeeks[week];
  return (
    <div>
      <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1">
        {mealWeeks.map((w, i) => (
          <button key={i} onClick={() => setWeek(i)}
            className={`flex-shrink-0 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all ${week===i ? "bg-emerald-500 text-white" : "bg-slate-800 text-slate-400 hover:text-white"}`}>
            {w.label}
          </button>
        ))}
      </div>
      <div className="space-y-2">
        {wk.days.map(day => {
          const ts = dayTypeStyles[day.type] || dayTypeStyles.weekday;
          const isOpen = openDays[day.day];
          return (
            <div key={day.day} className={`rounded-xl border ${ts.border} bg-slate-900/60 overflow-hidden`}>
              <button onClick={() => toggleDay(day.day)} className="w-full px-4 py-3 flex items-center justify-between hover:bg-white/5 transition-colors">
                <div className="flex items-center gap-3">
                  <span className="font-bold text-white text-sm">{day.day}</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full ${ts.badge}`}>{day.type.replace("-"," ")}</span>
                </div>
                <span className={`text-slate-400 text-sm transition-transform ${isOpen ? "rotate-180" : ""}`}>▾</span>
              </button>
              {isOpen && (
                <div className="px-4 pb-4 space-y-3 border-t border-slate-700/40 pt-3">
                  {["breakfast","lunch","dinner"].map(mk => {
                    const meal = day[mk]; const mc = mealColors[mk];
                    return (
                      <div key={mk} className="flex gap-3">
                        <div className="flex flex-col items-center pt-1">
                          <div className={`w-2 h-2 rounded-full ${mc.dot} mt-1`} />
                          <div className="w-px flex-1 bg-slate-700/40 mt-1" />
                        </div>
                        <div className="flex-1 pb-1">
                          <div className={`text-xs font-bold uppercase tracking-widest ${mc.accent} mb-1`}>{mc.label}</div>
                          <div className="text-sm text-white font-medium leading-snug">{meal.emoji} {meal.meal}</div>
                          <div className="text-xs text-slate-400 mt-0.5">{meal.note}</div>
                        </div>
                      </div>
                    );
                  })}
                  <div className="flex gap-3">
                    <div className="pt-1"><div className="w-2 h-2 rounded-full bg-pink-400 mt-1" /></div>
                    <div><div className="text-xs font-bold uppercase tracking-widest text-pink-400 mb-1">Fruit</div>
                    <div className="text-sm text-white">🍓 {day.fruit}</div></div>
                  </div>
                  {day.prepNote && (
                    <div className="bg-amber-500/10 border border-amber-500/20 rounded-lg px-3 py-2">
                      <p className="text-xs text-amber-300">{day.prepNote}</p>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── SCREEN: SHOPPING ────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
function ShopSectionCard({ section, sKey, checked, onToggle }) {
  const [open, setOpen] = useState(true);
  const c = cMap[section.color] || cMap.slate;
  const done = section.items.filter((_,i) => checked[`${sKey}-${i}`]).length;
  return (
    <div className={`rounded-xl border ${c.border} ${c.bg} overflow-hidden`}>
      <button onClick={() => setOpen(!open)} className="w-full px-4 py-2.5 flex items-center justify-between hover:bg-white/5 transition-colors">
        <div className="flex items-center gap-2">
          <span className={`font-bold text-sm ${c.header}`}>{section.section}</span>
          <span className={`text-xs px-2 py-0.5 rounded-full ${c.badge}`}>{done}/{section.items.length}</span>
        </div>
        <span className={`text-slate-400 text-sm transition-transform ${open ? "rotate-180" : ""}`}>▾</span>
      </button>
      {open && (
        <div className="px-4 pb-2 space-y-0.5 border-t border-white/5 pt-2">
          {section.items.map((item, i) => {
            const key = `${sKey}-${i}`; const isChecked = checked[key];
            return (
              <button key={i} onClick={() => onToggle(key)}
                className={`w-full flex items-center gap-3 py-1.5 px-2 rounded-lg text-left hover:bg-white/5 transition-all ${isChecked ? "opacity-40" : ""}`}>
                <div className={`w-4 h-4 rounded border-2 flex-shrink-0 flex items-center justify-center transition-all ${isChecked ? `${c.dot} border-transparent` : "border-slate-600"}`}>
                  {isChecked && <span className="text-white text-xs font-bold">✓</span>}
                </div>
                <span className={`flex-1 text-sm ${isChecked ? "line-through text-slate-500" : "text-white"}`}>
                  {item.name}{item.staple && !isChecked && <span className="ml-1.5 text-xs text-amber-400">⭐</span>}
                </span>
                <span className={`text-xs flex-shrink-0 ${isChecked ? "text-slate-600" : "text-slate-400"}`}>{item.amount}</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ShoppingScreen({ checked, onToggle, onReset }) {
  const [shopTab, setShopTab] = useState("w0");
  const isWeek = shopTab.startsWith("w");
  const weekIdx = isWeek ? parseInt(shopTab.slice(1)) : null;
  const currentWeek = (isWeek && !isNaN(weekIdx)) ? shopWeeks[weekIdx] : null;
  const isPantry = shopTab === "pantry";
  const countFor = (sections, prefix) => {
    let total=0, done=0;
    sections.forEach((s,si) => s.items.forEach((_,ii) => { total++; if(checked[`${prefix}-${si}-${ii}`]) done++; }));
    return {total,done};
  };
  const activeSections = currentWeek ? currentWeek.sections : isPantry ? pantryOnce.sections : [];
  const activePrefix = currentWeek ? `w${weekIdx}` : "pantry";
  const {total,done} = activeSections.length ? countFor(activeSections, activePrefix) : {total:0,done:0};
  const progress = total ? Math.round((done/total)*100) : 0;
  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <div className="text-2xl font-bold text-emerald-400">{progress}%</div>
        <div className="flex items-center gap-3">
          <span className="text-xs text-slate-400">{done}/{total} items</span>
          <button onClick={() => onReset(activePrefix)} className="text-xs text-rose-400 hover:text-rose-300">Reset</button>
        </div>
      </div>
      <div className="w-full bg-slate-800 rounded-full h-1.5 mb-3">
        <div className="bg-emerald-500 h-1.5 rounded-full transition-all" style={{width:`${progress}%`}} />
      </div>
      <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1">
        {shopWeeks.map((w,i) => (
          <button key={i} onClick={() => setShopTab(`w${i}`)}
            className={`flex-shrink-0 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all ${shopTab===`w${i}` ? "bg-emerald-500 text-white" : "bg-slate-800 text-slate-400 hover:text-white"}`}>
            {w.label}
          </button>
        ))}
        <button onClick={() => setShopTab("pantry")}
          className={`flex-shrink-0 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all ${isPantry ? "bg-amber-500 text-white" : "bg-slate-800 text-slate-400 hover:text-white"}`}>
          🧂 Pantry
        </button>
      </div>
      {isPantry && (
        <div className="bg-amber-950/40 border border-amber-700/30 rounded-xl px-4 py-3 mb-3">
          <p className="text-xs text-amber-300 font-bold mb-1">🧂 One-Time Pantry Stock</p>
          <p className="text-xs text-amber-200/70">{pantryOnce.note}</p>
        </div>
      )}
      <div className="space-y-2">
        {activeSections.map((section,si) => (
          <ShopSectionCard key={si} section={section} sKey={`${activePrefix}-${si}`} checked={checked} onToggle={onToggle} />
        ))}
      </div>
      <div className="mt-4 space-y-2">
        <div className="bg-rose-950/30 border border-rose-800/30 rounded-xl px-4 py-3">
          <p className="text-xs text-rose-300 font-bold mb-1">⚠️ Allergy Reminders</p>
          <ul className="text-xs text-rose-200/70 space-y-1">
            <li>• No sesame seeds, sesame oil, tahini, or sesame-containing blends</li>
            <li>• Check all spice mixes & sauces for hidden sesame</li>
            <li>• Watch for sunflower and poppy seeds — related sensitivity</li>
            <li>• Coconut/almond milk in place of dairy wherever possible</li>
          </ul>
        </div>
        <div className="bg-cyan-950/30 border border-cyan-800/30 rounded-xl px-4 py-3">
          <p className="text-xs text-cyan-300 font-bold mb-1">💧 DIY Electrolyte Water</p>
          <p className="text-xs text-cyan-200/70">16oz water + ¼ tsp sea salt + ¼ tsp cream of tartar + ½ lemon/lime + stevia (optional). Better than Gatorade Zero for keto. 💪</p>
        </div>
      </div>
    </div>
  );
}

function PrepSectionCard({ section, sIdx, checked, onToggle }) {
  const [open, setOpen] = useState(true);
  const c = cMap[section.colour];
  const done = section.tasks.filter((_,i) => checked[`prep-${sIdx}-${i}`]).length;
  return (
    <div className={`rounded-xl border ${c.border} ${c.bg} overflow-hidden`}>
      <button onClick={() => setOpen(!open)} className="w-full px-4 py-3 flex items-center justify-between hover:bg-white/5 transition-colors">
        <div className="flex items-center gap-2 flex-wrap">
          <span className={`font-bold text-sm ${c.header}`}>{section.title}</span>
          <span className={`text-xs px-2 py-0.5 rounded-full border ${c.badge}`}>{done}/{section.tasks.length}</span>
          <span className="text-xs text-slate-500">~{section.time}</span>
        </div>
        <span className={`text-slate-400 text-sm transition-transform flex-shrink-0 ml-2 ${open ? "rotate-180" : ""}`}>▾</span>

        <div className="px-4 pb-3 border-t border-white/5 pt-2 space-y-1">

            <CheckItem key={i} label={task.task} detail={task.detail}

              colorKey={section.colour} />

      )}

function PrepScreen({ checked, onToggle, onReset }) {
  const total = prepSections.reduce((a,s) => a+s.tasks.length, 0);
  const done = Object.keys(checked).filter(k => k.startsWith("prep-") && checked[k]).length;
  const progress = Math.round((done/total)*100);
  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <div>
          <div className="text-2xl font-bold text-emerald-400">{progress}%</div>
          <div className="text-xs text-slate-400">{done}/{total} tasks</div>
        </div>
        <button onClick={() => onReset("prep")} className="text-xs text-rose-400 hover:text-rose-300">Reset</button>
      </div>
      <div className="w-full bg-slate-800 rounded-full h-1.5 mb-4">
        <div className="bg-emerald-500 h-1.5 rounded-full transition-all" style={{width:`${progress}%`}} />
      </div>
      <div className="bg-amber-950/40 border border-amber-700/30 rounded-xl px-4 py-3 mb-3">
        <p className="text-xs text-amber-300 font-bold mb-1">🕐 Total Time: ~90 minutes</p>
        <p className="text-xs text-amber-200/70">Most of this runs simultaneously — bacon in oven while chicken grills while you assemble jars.</p>

          <PrepSectionCard key={si} section={section} sIdx={si} checked={checked} onToggle={onToggle} />

        <p className="text-xs text-emerald-300 font-bold mb-1">🏆 When You're Done</p>
        <p className="text-xs text-emerald-200/70">One focused Sunday sets you up for a full week of zero-stress mornings, great lunches and fast dinners. That's the whole game. 💪</p>

}

// ─── SCREEN: CUPBOARD ────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
function CupboardScreen({ stock, onToggleStock }) {
  const [activeTab, setActiveTab] = useState("stock");
  const [aiSuggestion, setAiSuggestion] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [openCats, setOpenCats] = useState({ proteins: true });
  const stockList = Object.keys(stock).filter(k => stock[k]);
  const planMatches = matchMealsToStock(stockList);
  const toggleCat = (id) => setOpenCats(p => ({ ...p, [id]: !p[id] }));

  const getAiSuggestions = async () => {
    if (!stockList.length) return;
    setAiLoading(true); setAiSuggestion("");
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6", max_tokens: 1000,
          messages: [{ role: "user", content: `You are a professional keto chef. The user has these ingredients: ${stockList.join(", ")}.\n\nDietary rules (STRICT):\n- Keto — no grains, no sugar, low carb\n- Lactose intolerant — no regular dairy (coconut/almond OK, aged hard cheese OK)\n- NO sesame, sunflower seeds, or poppy seeds\n- Permitted seeds: hemp hearts, chia seeds, coconut flakes\n\nSuggest 3 quick keto meals (under 20 min) they can make RIGHT NOW. Format as:\n\n🍳 BREAKFAST: [name] — [one line]\n🥗 LUNCH: [name] — [one line]\n🍽️ DINNER: [name] — [one line]\n\nBe a chef — make it sound delicious.` }]
        })
      });
      const data = await response.json();
      setAiSuggestion(data.content?.find(b => b.type==="text")?.text || "No suggestions available.");
    } catch { setAiSuggestion("Could not load suggestions — check your connection."); }
    setAiLoading(false);
  };

  return (
    <div>
      <div className="flex gap-1.5 mb-4">
        {[{id:"stock",label:"📦 My Stock"},{id:"suggest",label:"💡 Meal Ideas"}].map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)}
            className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all ${activeTab===t.id ? "bg-violet-500 text-white" : "bg-slate-800 text-slate-400 hover:text-white"}`}>
            {t.label}
          </button>
        ))}
      </div>

      {activeTab === "stock" && (
        <div className="space-y-2">
          <div className="flex items-center justify-between mb-1">
            <p className="text-xs text-slate-400">{stockList.length} items in stock</p>
            {stockList.length > 0 && <button onClick={() => stockList.forEach(k => onToggleStock(k))} className="text-xs text-rose-400 hover:text-rose-300">Clear all</button>}
          </div>
          {stockList.length > 0 && (
            <div className="bg-emerald-950/30 border border-emerald-700/30 rounded-xl px-3 py-2 mb-2">
              <p className="text-xs text-emerald-300 font-bold mb-1">✅ {stockList.length} items stocked</p>
              <div className="flex flex-wrap gap-1">
                {stockList.map(item => <span key={item} className="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30">{item}</span>)}
              </div>
            </div>
          )}
          {cupboardCategories.map(cat => {
            const c = cMap[cat.color] || cMap.slate;
            const isOpen = openCats[cat.id];
            const catCount = cat.items.filter(item => stock[item]).length;
            return (
              <div key={cat.id} className={`rounded-xl border ${c.border} ${c.bg} overflow-hidden`}>
                <button onClick={() => toggleCat(cat.id)} className="w-full px-4 py-2.5 flex items-center justify-between hover:bg-white/5 transition-colors">
                  <div className="flex items-center gap-2">
                    <span className={`font-bold text-sm ${c.header}`}>{cat.label}</span>
                    {catCount > 0 && <span className={`text-xs px-2 py-0.5 rounded-full ${c.badge}`}>{catCount} in stock</span>}
                  </div>
                  <span className={`text-slate-400 text-sm transition-transform ${isOpen ? "rotate-180" : ""}`}>▾</span>
                </button>
                {isOpen && (
                  <div className="px-4 pb-3 border-t border-white/5 pt-2">
                    <div className="grid grid-cols-2 gap-1">
                      {cat.items.map(item => {
                        const has = !!stock[item];
                        return (
                          <button key={item} onClick={() => onToggleStock(item)}
                            className={`flex items-center gap-2 py-1.5 px-2 rounded-lg text-left text-xs transition-all hover:bg-white/5 ${has ? "opacity-100" : "opacity-60"}`}>
                            <div className={`w-4 h-4 rounded border-2 flex-shrink-0 flex items-center justify-center transition-all ${has ? `${c.dot} border-transparent` : "border-slate-600"}`}>
                              {has && <span className="text-white text-xs font-bold">✓</span>}
                            </div>
                            <span className={has ? "text-white font-medium" : "text-slate-400"}>{item}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
          <div className="bg-slate-800/50 border border-slate-700/40 rounded-xl px-4 py-3 mt-2">
            <p className="text-xs text-slate-400">💡 Stock you tick here also powers the Walk-In Cookbook's Cook Tonight tab — it'll rank what you can make right now.</p>
          </div>
        </div>
      )}

      {activeTab === "suggest" && (
        <div className="space-y-3">
          {stockList.length === 0 ? (
            <div className="bg-slate-800/50 border border-slate-700/40 rounded-xl px-4 py-6 text-center">
              <p className="text-sm text-slate-400 mb-1">No items in stock yet</p>
              <p className="text-xs text-slate-500">Go to 📦 My Stock and tick what you have.</p>
            </div>
          ) : (
            <>
              {planMatches.length > 0 && (
                <div>
                  <p className="text-xs font-bold uppercase tracking-widest text-emerald-400 mb-2">📋 From Your Meal Plan</p>
                  <div className="space-y-1.5">
                    {planMatches.map((m, i) => (
                      <div key={i} className="bg-emerald-950/30 border border-emerald-700/30 rounded-xl px-3 py-2.5 flex items-start gap-3">
                        <span className="text-xl flex-shrink-0">{m.emoji}</span>
                        <div>
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-xs font-bold text-emerald-400">{m.type}</span>
                            <span className="text-xs text-slate-500">{m.week} · {m.day}</span>
                          </div>
                          <p className="text-sm text-white mt-0.5 leading-snug">{m.meal}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              <div>
                <div className="flex items-center justify-between mb-2">
                  <p className="text-xs font-bold uppercase tracking-widest text-violet-400">🤖 AI Chef Suggestions</p>
                  <span className="text-xs text-slate-500">{stockList.length} items</span>
                </div>
                {!aiSuggestion && !aiLoading && (
                  <div className="bg-violet-950/30 border border-violet-700/30 rounded-xl px-4 py-4 text-center">
                    <p className="text-sm text-slate-300 mb-3">Get keto meal ideas based on exactly what you have right now</p>
                    <button onClick={getAiSuggestions} className="bg-violet-500 hover:bg-violet-400 text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all">✨ Suggest Meals From My Stock</button>
                  </div>
                )}
                {aiLoading && (
                  <div className="bg-violet-950/30 border border-violet-700/30 rounded-xl px-4 py-6 text-center">
                    <div className="text-2xl mb-2 animate-pulse">🍳</div>
                    <p className="text-sm text-violet-300">Chef is thinking...</p>
                  </div>
                )}
                {aiSuggestion && !aiLoading && (
                  <div className="bg-violet-950/30 border border-violet-700/30 rounded-xl px-4 py-4 space-y-3">
                    {aiSuggestion.split("\n").filter(l => l.trim()).map((line, i) => (
                      <p key={i} className="text-sm text-slate-200 leading-relaxed">{line}</p>
                    ))}
                    <button onClick={getAiSuggestions} className="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium px-4 py-2 rounded-lg transition-all">🔄 Refresh</button>
                  </div>
                )}
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

                      {have && <span className="text-black text-xs font-bold">✓</span>}

    <button onClick={() => onOpen(recipe.id)} className="text-left rounded-xl overflow-hidden w-full transition-colors bg-slate-900/80 border border-slate-800 hover:border-slate-700" style={{ borderLeft: `3px solid ${m.color}` }}>
      <div className="p-4">
        <div className="flex items-center justify-between mb-2">
          <CbMealTag meal={recipe.meal} />

          {recipe.flavor.map(f => <span key={f} className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 capitalize">{f}</span>)}
          {recipe.grabGo && <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-teal-400">grab & go</span>}
          {recipe.thermos && <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-sky-400">thermos</span>}
        </div>

function CookbookBrowseTab({ haveIngredients, onOpen }) {
  const [search, setSearch] = useState("");
  const [mealFilter, setMealFilter] = useState("all");
  const [flavorFilters, setFlavorFilters] = useState(new Set());
  const [quickFilters, setQuickFilters] = useState(new Set());
  const toggle = (setter, val) => setter(prev => { const n = new Set(prev); n.has(val) ? n.delete(val) : n.add(val); return n; });

  const filtered = useMemo(() => COOKBOOK.filter(r => {
    if (mealFilter !== "all" && r.meal !== mealFilter) return false;
    if (search && !r.name.toLowerCase().includes(search.toLowerCase())) return false;
    if (flavorFilters.size && !r.flavor.some(f => flavorFilters.has(f))) return false;
    if (quickFilters.has("quick") && r.time > 15) return false;
    if (quickFilters.has("grabGo") && !r.grabGo) return false;
    if (quickFilters.has("thermos") && !r.thermos) return false;
    if (quickFilters.has("sundayPrep") && !r.sundayPrep) return false;
    return true;
  }), [search, mealFilter, flavorFilters, quickFilters]);

  return (
    <div>
      <div className="relative mb-4">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">🔍</span>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search the cookbook…"
          className="w-full rounded-lg pl-9 pr-3 py-2.5 text-sm bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-slate-600" />
      </div>
      <div className="flex flex-wrap gap-1.5 mb-3">
        {["all","breakfast","lunch","dinner","snack"].map(mm => (
          <button key={mm} onClick={() => setMealFilter(mm)}
            className="text-xs font-semibold uppercase tracking-wide px-3 py-1.5 rounded-full transition-all"
            style={mealFilter===mm ? { backgroundColor: mm==="all" ? "#fb7a3c" : MEAL_META[mm]?.color || "#fb7a3c", color: "#0b1120" } : { backgroundColor: "#1e293b", color: "#8694ab" }}>
            {mm==="all" ? "All" : MEAL_META[mm].label}
          </button>
        ))}
      </div>
      <div className="flex flex-wrap gap-1.5 mb-3">
        {CB_FLAVORS.map(f => (
          <button key={f} onClick={() => toggle(setFlavorFilters, f)}
            className="text-xs capitalize px-2.5 py-1 rounded-full border transition-all"
            style={flavorFilters.has(f) ? { borderColor:"#fb7a3c", color:"#fb7a3c" } : { borderColor:"#2a3650", color:"#8694ab" }}>
            {f}
          </button>
        ))}
      </div>
      <div className="flex flex-wrap gap-1.5 mb-5">
        {[["quick","≤15 min"],["grabGo","grab & go"],["thermos","thermos"],["sundayPrep","Sunday prep"]].map(([key, label]) => (
          <button key={key} onClick={() => toggle(setQuickFilters, key)}
            className="text-xs px-2.5 py-1 rounded-full border transition-all"
            style={quickFilters.has(key) ? { borderColor:"#2dd4bf", color:"#2dd4bf" } : { borderColor:"#2a3650", color:"#8694ab" }}>
            {label}
          </button>
        ))}
      </div>
      {filtered.length === 0 ? (
        <p className="text-sm text-center py-12 text-slate-600">No matches — clear a filter.</p>
      ) : (
        <div className="space-y-2">{filtered.map(r => <CbRecipeCard key={r.id} recipe={r} onOpen={onOpen} />)}</div>
      )}
    </div>
  );
}

function CookTonightTab({ haveIngredients, onToggleIngredient, onOpen }) {
  const [pantryOpen, setPantryOpen] = useState(true);
  const grouped = CB_CAT_ORDER.map(cat => ({ cat, items: ALL_CB_INGREDIENTS.filter(n => (CB_CAT_MAP[n] || "Pantry & Spice") === cat) }));

  const ranked = useMemo(() => COOKBOOK.map(r => {
    const total = r.ingredients.length;
    const haveCount = r.ingredients.filter(i => haveIngredients.has(i.name)).length;
    const pct = total ? Math.round((haveCount/total)*100) : 0;
    const missing = r.ingredients.filter(i => !haveIngredients.has(i.name));
    return { ...r, pct, haveCount, total, missing };
  }).sort((a,b) => b.pct - a.pct || a.time - b.time), [haveIngredients]);

  const ready = ranked.filter(r => r.pct >= 80);
  const almost = ranked.filter(r => r.pct >= 50 && r.pct < 80);
  const trip = ranked.filter(r => r.pct < 50);

  return (
    <div className="space-y-5">
      <div className="rounded-xl bg-slate-900 border border-slate-800">
        <button onClick={() => setPantryOpen(v => !v)} className="w-full flex items-center justify-between px-4 py-3">
          <span className="flex items-center gap-2 text-sm font-semibold text-white">🎒 What's in the kitchen right now</span>
          <span className="text-slate-500 text-sm">{pantryOpen ? "▴" : "▾"}</span>
        </button>
        {pantryOpen && (
          <div className="px-4 pb-4 grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4 border-t border-slate-800 pt-3">
            {grouped.map(({ cat, items }) => (
              <div key={cat}>
                <h5 className="text-[10px] uppercase tracking-widest mb-2 text-slate-600">{cat}</h5>
                <div className="flex flex-wrap gap-1.5">
                  {items.map(name => {
                    const have = haveIngredients.has(name);
                    return (
                      <button key={name} onClick={() => onToggleIngredient(name)}
                        className="text-xs capitalize px-2 py-1 rounded-full border transition-all"
                        style={have ? { backgroundColor:"#fb7a3c22", borderColor:"#fb7a3c", color:"#fb7a3c" } : { borderColor:"#2a3650", color:"#8694ab" }}>
                        {name}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {[["🔥 Ready now", ready, "#fb7a3c"], ["⚡ Almost there", almost, "#f5b942"], ["🛒 Need a grocery run", trip, "#64748b"]].map(([title, list, color]) => (
        <div key={title}>
          <h4 className="text-xs uppercase tracking-widest mb-2 flex items-center gap-2" style={{ color }}>
            {title} <span className="text-slate-600 font-mono">({list.length})</span>
          </h4>
          {list.length === 0 ? <p className="text-xs text-slate-600 mb-3">Nothing here yet.</p> : (
            <div className="space-y-2 mb-2">
              {list.map(r => (
                <button key={r.id} onClick={() => onOpen(r.id)} className="w-full text-left rounded-xl p-3 bg-slate-900 border border-slate-800" style={{ borderLeft: `3px solid ${MEAL_META[r.meal].color}` }}>
                  <div className="flex items-center justify-between mb-2 gap-3">
                    <span className="text-sm font-semibold text-white">{r.name}</span>
                    <span className="font-mono text-xs text-slate-600 shrink-0">{r.haveCount}/{r.total}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="h-1.5 flex-1 rounded-full overflow-hidden bg-slate-800">
                      <div className="h-full rounded-full transition-all" style={{ width: r.pct+"%", backgroundColor: color }} />
                    </div>
                    <span className="font-mono text-xs shrink-0" style={{ color }}>{r.pct}%</span>
                  </div>
                  {r.missing.length > 0 && r.missing.length <= 4 && (
                    <p className="mt-1.5 text-xs text-slate-600">missing: {r.missing.map(m => m.name).join(", ")}</p>
                  )}
                </button>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function CookbookScreen({ haveIngredients, onToggleIngredient }) {
  const [cbTab, setCbTab] = useState("browse");
  const [selectedId, setSelectedId] = useState(null);
  const selectedRecipe = selectedId ? COOKBOOK.find(r => r.id === selectedId) : null;

  return (
    <div>
      <div className="flex gap-1.5 mb-4">
        {[{id:"browse",label:"📖 Browse"},{id:"tonight",label:"🔥 Cook Tonight"}].map(t => (
          <button key={t.id} onClick={() => setCbTab(t.id)}
            className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all ${cbTab===t.id ? "text-white" : "bg-slate-800 text-slate-400 hover:text-white"}`}
            style={cbTab===t.id ? { backgroundColor:"#fb7a3c" } : {}}>
            {t.label}
          </button>
        ))}
      </div>
      {cbTab === "browse" && <CookbookBrowseTab haveIngredients={haveIngredients} onOpen={setSelectedId} />}
      {cbTab === "tonight" && <CookTonightTab haveIngredients={haveIngredients} onToggleIngredient={onToggleIngredient} onOpen={setSelectedId} />}
      {selectedRecipe && <CbRecipeDetail recipe={selectedRecipe} haveIngredients={haveIngredients} onToggleIngredient={onToggleIngredient} onClose={() => setSelectedId(null)} />}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// ─── MAIN APP ────────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
const navItems = [
  { id:"plan",     label:"Meal Plan",  emoji:"🍳" },
  { id:"cookbook", label:"Cookbook",   emoji:"📖" },
  { id:"jars",     label:"Jar Recipes",emoji:"🫙" },
  { id:"prep",     label:"Prep Day",   emoji:"🗓️" },
  { id:"cupboard", label:"Cupboard",   emoji:"🏠" },
  { id:"shop",     label:"Shopping",   emoji:"🛒" },
];

const screenTitles = {
  plan:     { title:"🍳 Keto Meal Plan",    sub:"4 Weeks · Sesame-free · Lactose-aware · Full flavour" },
  shop:     { title:"🛒 Weekly Shopping",   sub:"Mapped to your meal plan · ⭐ = weekly staple" },
  jars:     { title:"🫙 Jar Recipes",       sub:"7 overnight jars · Tap to expand · 3 min prep each" },
  prep:     { title:"🗓️ Sunday Prep",       sub:"~90 min · Sets up your entire week" },
  cupboard: { title:"🏠 What's In Stock",   sub:"Track pantry · Get AI meal ideas" },
  cookbook: { title:"📖 The Walk-In",       sub:"25 recipes · Cook Tonight matches your kitchen" },
};

function KetoApp() {
  const [screen, setScreen] = useState("plan");
  const [shopChecked, setShopChecked] = useState({});
  const [prepChecked, setPrepChecked] = useState({});
  const [stock, setStock] = useState({});
  // Shared ingredient state — Cupboard stock + Cookbook Cook Tonight both use this
  const [cbIngredients, setCbIngredients] = useState(new Set());

  const toggleShop  = (key)  => setShopChecked(prev => ({ ...prev, [key]: !prev[key] }));
  const togglePrep  = (key)  => setPrepChecked(prev => ({ ...prev, [key]: !prev[key] }));
  const toggleStock = (item) => setStock(prev => ({ ...prev, [item]: !prev[item] }));
  const toggleCbIng = (name) => setCbIngredients(prev => { const n = new Set(prev); n.has(name) ? n.delete(name) : n.add(name); return n; });

  const resetByPrefix = (prefix, setter) => {
    setter(prev => {
      const next = { ...prev };
      Object.keys(next).forEach(k => { if (k.startsWith(prefix)) delete next[k]; });
      return next;
    });
  };

  const s = screenTitles[screen];

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col" style={{ fontFamily:"'Georgia', serif" }}>
      {/* ── Sticky Top Header ── */}
      <div className="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800">
        <div className="max-w-2xl mx-auto px-4 py-3">
          <h1 className="text-lg font-bold text-white">{s.title}</h1>
          <p className="text-xs text-slate-400 mt-0.5">{s.sub}</p>
        </div>
      </div>

      {/* ── Content ── */}
      <div className="flex-1 max-w-2xl mx-auto w-full px-4 py-4 pb-28">
        {screen === "plan"     && <MealPlanScreen />}
        {screen === "shop"     && <ShoppingScreen checked={shopChecked} onToggle={toggleShop} onReset={(p) => resetByPrefix(p, setShopChecked)} />}
        {screen === "jars"     && <JarsScreen />}
        {screen === "prep"     && <PrepScreen checked={prepChecked} onToggle={togglePrep} onReset={(p) => resetByPrefix(p, setPrepChecked)} />}
        {screen === "cupboard" && <CupboardScreen stock={stock} onToggleStock={toggleStock} />}
        {screen === "cookbook" && <CookbookScreen haveIngredients={cbIngredients} onToggleIngredient={toggleCbIng} />}
      </div>

      {/* ── Bottom Nav ── */}
      <div className="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/98 backdrop-blur border-t border-slate-800">
        <div className="max-w-2xl mx-auto flex">
          {navItems.map(item => (
            <button key={item.id} onClick={() => setScreen(item.id)}
              className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 transition-all ${screen===item.id ? "text-emerald-400" : "text-slate-500 hover:text-slate-300"}`}>
              <span className="text-base">{item.emoji}</span>
              <span className="font-medium" style={{fontSize:"9px"}}>{item.label}</span>
              {screen===item.id && <div className="w-1 h-1 rounded-full bg-emerald-400 mt-0.5" />}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KetoApp />);
  </script>
</body>
</html>
