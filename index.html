        try {

          return Promise.resolve(val !== null ? { value: val } : null);
        } catch(e) { return Promise.resolve(null); }
      },
      set: (key, value) => {
        try { localStorage.setItem(key, value); return Promise.resolve({ key, value }); }

ameGauge pct={r.pct}/>{r.missing.length>0&&r.missing.length<=4&&<p className="mt-2 text-xs"style={{color:"#4b5876"}}>missing: {r.missing.map(m=>m.name).join(", ")}</p>}</button>)}</div>}</div>)}</div>;

    function PlannerTab({mealPlan,assignRecipe,removeRecipe,clearWeek,onOpenPicker}){

      return<div className="fixed inset-0 z-50 flex items-center justify-center p-4"><div className="absolute inset-0 bg-black/60"onClick={onClose}/><div className="relative w-full max-w-lg max-h-[80vh] flex flex-col rounded-md"style={{backgroundColor:"#0f1726"}}><div className="flex items-center justify-between px-5 py-4"style={{borderBottom:"1px solid #1c2740"}}><h3 className="text-slate-100 font-semibold">Add to {day} · {MEAL_META[meal].label}</h3><button onClick={onClose}><X size={18} color="#8694ab"/></button></div><div className="px-5 pt-4"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search recipes…" className="w-full rounded-md px-3 py-2 text-sm mb-3"style={{backgroundColor:"#131c2e",color:"#e8edf5",border:"1px solid #1c2740"}}/><div className="flex flex-wrap gap-2 mb-3">{["all","breakfast","lunch","dinner","snack"].map(mm=><button key={mm} onClick={()=>setFilterMeal(mm)} className="text-xs px-2.5 py-1 rounded-full"style={filterMeal===mm?{backgroundColor:"#fb7a3c",color:"#0b1120"}:{backgroundColor:"#131c2e",color:"#8694ab"}}>{mm==="all"?"All":MEAL_META[mm].label}</button>)}</div></div><div className="overflow-y-auto px-5 pb-5 space-y-2">{list.map(r=><button key={r.id} onClick={()=>onPick(r.id)} className="w-full text-left rounded-md p-3 flex items-center justify-between"style={{backgroundColor:"#131c2e",borderLeft:`3px solid ${MEAL_META[r.meal].color}`}}><div><p className="text-sm text-slate-100">{r.name}</p><p className="text-xs"style={{color:"#4b5876"}}>{r.time} min</p></div><Plus size={15} color="#4b5876"/></button>)}{list.length===0&&<p className="text-sm text-center py-8"style={{color:"#4b5876"}}>No matches.</p>}</div></div></div>;

    function ShoppingTab({mealPlan,haveIngredients,boughtItems,toggleBought,onGoToPlanner}){
      const [showStocked,setShowStocked]=useState(false);

      const needed=useMemo(()=>{const map={};plannedRecipes.forEach(recipe=>recipe.ingredients.forEach(i=>{if(haveIngredients.has(i.name))return;if(!map[i.name])map[i.name]={name:i.name,labels:new Set(),category:CATEGORY_MAP[i.name]||"Pantry & Spice"};map[i.name].labels.add(i.label);}));return Object.values(map);},[plannedRecipes,haveIngredients]);
      const stocked=useMemo(()=>{const map={};plannedRecipes.forEach(recipe=>recipe.ingredients.forEach(i=>{if(!haveIngredients.has(i.name))return;if(!map[i.name])map[i.name]={name:i.name};} ));return Object.values(map);},[plannedRecipes,haveIngredients]);

    const TABS=[{key:"cookbook",label:"Cookbook",icon:BookOpen},{key:"tonight",label:"Cook Tonight",icon:Flame},{key:"planner",label:"Planner",icon:CalendarDays},{key:"shopping",label:"Shopping",icon:ShoppingCart}];

    function App(){
      const [tab,setTab]=useState("cookbook");
      const [isLoading,setIsLoading]=useState(true);
      const [haveIngredients,setHaveIngredients]=useState(new Set());
      const [mealPlan,setMealPlan]=useState(emptyPlan());
      const [boughtItems,setBoughtItems]=useState(new Set());
      const [selectedId,setSelectedId]=useState(null);
      const [picker,setPicker]=useState(null);

      useEffect(()=>{
        let mounted=true;
        (async()=>{
          try{
            const [pantryRes,planRes,boughtRes]=await Promise.allSettled([window.storage.get("walkin-pantry"),window.storage.get("walkin-mealplan"),window.storage.get("walkin-bought")]);
            if(!mounted)return;
            if(pantryRes.status==="fulfilled"&&pantryRes.value)setHaveIngredients(new Set(JSON.parse(pantryRes.value.value)));
            if(planRes.status==="fulfilled"&&planRes.value)setMealPlan(JSON.parse(planRes.value.value));
            if(boughtRes.status==="fulfilled"&&boughtRes.value)setBoughtItems(new Set(JSON.parse(boughtRes.value.value)));
          }catch(e){console.error("Load failed",e);}
          finally{if(mounted)setIsLoading(false);}
        })();
        return()=>{mounted=false;};
      },[]);

      const togglePantryItem=(name)=>setHaveIngredients(prev=>{const next=new Set(prev);next.has(name)?next.delete(name):next.add(name);window.storage.set("walkin-pantry",JSON.stringify(Array.from(next)));return next;});
      const assignRecipe=(day,meal,recipeId)=>{setMealPlan(prev=>{const next={...prev,[day]:{...prev[day],[meal]:recipeId}};window.storage.set("walkin-mealplan",JSON.stringify(next));return next;});setPicker(null);};
      const removeRecipe=(day,meal)=>setMealPlan(prev=>{const next={...prev,[day]:{...prev[day],[meal]:null}};window.storage.set("walkin-mealplan",JSON.stringify(next));return next;});
      const clearWeek=()=>{const next=emptyPlan();setMealPlan(next);window.storage.set("walkin-mealplan",JSON.stringify(next));};
      const toggleBought=(name)=>setBoughtItems(prev=>{const next=new Set(prev);next.has(name)?next.delete(name):next.add(name);window.storage.set("walkin-bought",JSON.stringify(Array.from(next)));return next;});
      const selectedRecipe=selectedId?RECIPES.find(r=>r.id===selectedId):null;

      if(isLoading)return<div className="min-h-screen flex items-center justify-center"style={{backgroundColor:"#0b1120"}}><Flame size={28} color="#fb7a3c"/></div>;

      return(
        <div className="min-h-screen pb-16"style={{backgroundColor:"#0b1120"}}>
          <header className="px-5 pt-8 pb-5"style={{borderBottom:"1px solid #131c2e"}}>
            <h1 className="text-slate-100 tracking-tight"style={{fontFamily:"Oswald,sans-serif",fontSize:"28px",fontWeight:700}}>THE WALK-IN</h1>
            <p className="text-sm mt-1"style={{color:"#4b5876"}}>Keto, flavor-first, built for a 15km day. No lactose, no sesame or related seeds.</p>
          </header>
          <nav className="sticky top-0 z-20 flex px-5 gap-1 overflow-x-auto"style={{backgroundColor:"#0b1120",borderBottom:"1px solid #131c2e"}}>
            {TABS.map(({key,label,icon:Icon})=>(
              <button key={key} onClick={()=>setTab(key)} className="flex items-center gap-2 px-4 py-3.5 text-sm font-medium whitespace-nowrap border-b-2"style={tab===key?{color:"#fb7a3c",borderColor:"#fb7a3c"}:{color:"#4b5876",borderColor:"transparent"}}>
                <Icon size={15}/> {label}
              </button>
            ))}
          </nav>
          <main className="px-5 pt-5 max-w-5xl mx-auto">
            {tab==="cookbook"&&<CookbookTab onOpen={setSelectedId}/>}
            {tab==="tonight"&&<CookTonightTab haveIngredients={haveIngredients} togglePantryItem={togglePantryItem} onOpen={setSelectedId}/>}
            {tab==="planner"&&<PlannerTab mealPlan={mealPlan} assignRecipe={assignRecipe} removeRecipe={removeRecipe} clearWeek={clearWeek} onOpenPicker={(day,meal)=>setPicker({day,meal})}/>}
            {tab==="shopping"&&<ShoppingTab mealPlan={mealPlan} haveIngredients={haveIngredients} boughtItems={boughtItems} toggleBought={toggleBought} onGoToPlanner={()=>setTab("planner")}/>}
          </main>
          {selectedRecipe&&<RecipeDetail recipe={selectedRecipe} haveIngredients={haveIngredients} togglePantryItem={togglePantryItem} onAssign={assignRecipe} onClose={()=>setSelectedId(null)}/>}
          {picker&&<PlannerPicker day={picker.day} meal={picker.meal} onPick={recipeId=>assignRecipe(picker.day,picker.meal,recipeId)} onClose={()=>setPicker(null)}/>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',function(){
        navigator.serviceWorker.register('./service-worker.js').catch(function(err){console.error('SW failed:',err);});
      });
    }
  </script>
</body>
</html>
